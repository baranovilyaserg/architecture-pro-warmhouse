openapi: 3.0.3
info:
  title: Device Controller API
  version: 1.0.0
  description: API for device controller service to interact with devices and their telemetry in the smart house system.
servers:
  - url: http://localhost:8084
paths:
  /devices/{deviceId}/telemetry:
    get:
      summary: Get telemetry for a device (controller request)
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of telemetry records for the device
          content:
            application/json:
              examples:
                telemetry:
                  $ref: '/examples/telemetry-example.json'
        '404':
          description: Not found
          content:
            application/json:
              example:
                $ref: '/examples/404-example.json'
  /devices/{deviceId}/command:
    post:
      summary: Send command to device
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommand'
      responses:
        '200':
          description: Command sent to device
components:
  schemas:
    DeviceCommand:
      type: object
      required: [command, parameters]
      properties:
        command:
          type: string
        parameters:
          type: object
          additionalProperties: true
